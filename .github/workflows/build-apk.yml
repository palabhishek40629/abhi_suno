name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Fat Release APK)
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v3.5.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v3.5.0-release
          path: AbhiSuno-v3.5.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.5.0-${{ github.run_number }}
          name: "Abhi Suno v3.5.0 Master Edition (Build ${{ github.run_number }})"
          body: |
            ### 🎧 Abhi Suno v3.5.0 Master Edition - Next-Gen Audio & DJ Engine
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - 🎧 **Next-Gen Audio & DJ Engine:**
              - **Seamless DJ Crossfade (0ms Silence):** Smooth 2-8s crossfade blending tracks with zero delay.
              - **Dynamic Volume Normalization (ReplayGain):** Intelligently balances volume differences between 70s-90s retro tracks and punchy modern beats.
              - **10-Band Studio Equalizer & 3D Spatial Surround:** 10 sliders (32Hz to 16kHz), bass boost dial, 3D surround sound toggle, and tailored acoustic presets (Car Audio Ultra-Bass, Vocal Booster, Rock Stage, Acoustic Live, Dolby Atmos 360°).
            - ⚡ **Instant Play & Auto Fullscreen Player:**
              - Tapping any track anywhere instantly halts prior audio and launches the immersive fullscreen NowPlaying player.
            - 🌟 **Edge-to-Edge Fullscreen HD Startup Poster:**
              - Startup splash uses high-res edge-to-edge rendering with full screen coverage.
            - ♾️ **Continuous Infinite Discovery Feed:**
              - Fast, non-blocking endless feed scrolling on Home Screen powered by an in-memory 10-minute cache and 23-genre query pool.
            - 🌅 **Time-of-Day AI Curated Mix:**
              - Dynamically shifts across Morning Energy, Afternoon Focus, Sunset Golden Classics, and Midnight Lo-Fi based on user time.
            - 💖 **Radiant Glowing Buttons & Fullscreen Bubble Celebration:**
              - Glowing neon gradients on Like and Play buttons; liking any track unleashes 36 floating radiant neon spheres and hearts across the device screen.
            - 👤 **Customizable User Profile:**
              - Edit name modal dialog and native photo gallery picker directly from Profile Screen.
            - 🗂️ **Collapsible Accordion Settings:**
              - Organized into clean expandable accordion cards inside Profile Screen.
            - 🎤 **Synchronized Karaoke Lyrics Engine:**
              - Multi-engine search with synchronized glowing line-by-line karaoke tracking.

            **Direct APK Download:** `AbhiSuno-v3.5.0-release.apk`
          files: AbhiSuno-v3.5.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
