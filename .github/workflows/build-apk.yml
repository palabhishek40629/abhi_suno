name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.jks \
            -alias abhisuno -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass abhisuno123 -keypass abhisuno123 \
            -dname "CN=Abhishek Pal, OU=AbhiSuno, O=AbhiSuno Inc, L=Varanasi, S=UP, C=IN"

      - name: Build Android APK (Fat Release APK)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build.log

      - name: Capture Build Failure Log
        if: failure()
        run: |
          tail -n 120 build.log > build_error.txt
          cat build_error.txt

      - name: Publish Failure Details to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error-${{ github.run_number }}
          name: "Build Failure Log ${{ github.run_number }}"
          body_path: build_error.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v4.4.2-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v4.4.2-release
          path: AbhiSuno-v4.4.2-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4.2-${{ github.run_number }}
          name: "Abhi Suno v4.4.2 Master Edition (Build ${{ github.run_number }})"
          body: |
            ### 🎧 Abhi Suno v4.4.2 Master Edition
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - ⚡ **100% Instant Playback & Offline Gate Removal:**
              - Completely removed the false-negative `ConnectivityService.isOnline` blocking check inside `audio_handler.dart` which caused startup stream aborts.
              - 100% JioSaavn Akamai CDN direct streaming with automatic multi-bitrate fallback (320kbps -> 160kbps -> 96kbps).
              - Play / Pause state synchronization and immediate buffering reset on errors.
            - 🌟 **Subtle 3D Curved Paragraph Karaoke with Exact Voice Tracking:**
              - Fast concurrent lyrics engine querying LRCLIB synced lyrics (real millisecond singer-voice timestamps) and JioSaavn official lyrics in parallel (<2.5s).
              - Auto-timeline karaoke generator when lyrics lack timestamps so 100% of songs feature live 3D neon voice tracking.
              - Active singer lyrics line styled as a subtle 3D curved plate (`scale: 1.04`, no oversized zoom, dual cyan/pink neon ambient glow).
              - Rendered in authentic Devanagari Hindi calligraphy using `AmsSudha` font.
              - Expanded song vocabulary dictionary with 100% accurate Hindi grammar.
            - 📱 **Performance & Offline Stability:**
              - Direct lyrics download (.txt) option in the lyrics sheet.
              - Error-resilient caching and fast local playback.

            **Direct APK Download:** `AbhiSuno-v4.4.2-release.apk`
          files: AbhiSuno-v4.4.2-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

