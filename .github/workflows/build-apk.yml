name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.jks \
            -alias abhisuno -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass abhisuno123 -keypass abhisuno123 \
            -dname "CN=Abhishek Pal, OU=AbhiSuno, O=AbhiSuno Inc, L=Varanasi, S=UP, C=IN"

      - name: Build Android APK (Fat Release APK)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build.log

      - name: Capture Build Failure Log
        if: failure()
        run: |
          tail -n 120 build.log > build_error.txt
          cat build_error.txt

      - name: Publish Failure Details to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error-${{ github.run_number }}
          name: "Build Failure Log ${{ github.run_number }}"
          body_path: build_error.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v4.4.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v4.4.0-release
          path: AbhiSuno-v4.4.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4.0-${{ github.run_number }}
          name: "Abhi Suno v4.4.0 Master Edition (Build ${{ github.run_number }})"
          body: |
            ### 🎧 Abhi Suno v4.4.0 Master Edition
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - ⚡ **100% JioSaavn Playback & Zero YouTube Dependency:**
              - Completely purged `youtube_explode_dart` and all YouTube resolvers.
              - 100% high-speed Akamai CDN audio playback with DES decryption and multi-bitrate fallback (320kbps -> 160kbps -> 96kbps).
              - Resolved ExoPlayer connection header conflict so online songs play instantly with 0ms delay.
            - 🎮 **Instant & Reactive Play/Pause Controls:**
              - Fixed play/pause button state reactivity across Now Playing screen, Mini Player, and lock screen controls.
              - Prevents stuck buffering states and auto-reloads audio source if player becomes idle.
            - 🌟 **Universal Devanagari Sudha (`AmsSudha`) Lyrics Engine:**
              - 500+ song vocabulary dictionary covering popular English, Punjabi, Bhojpuri, and international song words.
              - Advanced syllabic phonetic transliteration engine converts any language into authentic Devanagari Hindi calligraphy.
              - Millisecond-precise reverse-index voice detection sync so active lyrics line never desyncs from the singer.
              - 3D embossed curved paragraph with dual cyan-pink neon glow matching the play button.
            - 📥 **Sequential FIFO Download System:**
              - Multi-track downloads process one-by-one with full progress feedback.
              - Direct lyrics text download to device's public Downloads directory.

            **Direct APK Download:** `AbhiSuno-v4.4.0-release.apk`
          files: AbhiSuno-v4.4.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

