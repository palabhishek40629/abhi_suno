name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Fat Release APK)
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v3.8.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v3.8.0-release
          path: AbhiSuno-v3.8.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.8.0-${{ github.run_number }}
          name: "Abhi Suno v3.8.0 Master Edition (Build ${{ github.run_number }})"
          body: |
            ### 🎧 Abhi Suno v3.8.0 Master Edition - Party Room & Instant Next Engine
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - 🚀 **Zero-Delay Next Track Playback:**
              - Next button instantly transitions from 0:00 to the subsequent track with 0 delay.
              - Auto-fetches next recommendation batch seamlessly when queue reaches last 2 tracks, completely eliminating single-track looping.
            - 👥 **पार्टी रूम ("सुनो साथ में" / Listen Together):**
              - Positioned elegantly in Profile Screen directly between Audio & DJ Engine and Language Settings.
              - **Option 1 (पार्टी रूम बनाएं / Generate Code):** Generates unique 6-digit party room code (`ABHI-XXXX`), real-time device counter, and WhatsApp invite sharing.
              - **Option 2 (रूम से जुड़ें / Join Room):** Modal input to connect unlimited devices to stream music together in real-time.
            - 🔍 **Live JioSaavn Instant Search & Playlists:**
              - Autocomplete search suggestions directly powered by JioSaavn live catalog (<50ms response).
              - Dedicated **Playlists & Albums** section in search results with cover art, track count badge, and instant tap-to-play.
              - Added `playlists` filter chip alongside `all`, `songs`, and `artists`.
            - 💎 **Radiant Glowing Buttons App-Wide:**
              - All playback controls (Previous, Next, Shuffle, Repeat, Like, Song Share, Download, Lyrics, EQ, PiP) styled with radiant circular gradients and luminous ambient drop shadows matching the Big Play button.
            - 🌟 **Enhanced 3D Touch/Elevation Effect:**
              - Noticeably smoother, larger 3D tactile elevation (`scaleElevation: 1.15`, `Curves.easeOutBack`, 28px radiant bloom) on touch across all controls and interactive cards.

            **Direct APK Download:** `AbhiSuno-v3.8.0-release.apk`
          files: AbhiSuno-v3.8.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

