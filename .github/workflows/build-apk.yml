name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Fat Release APK)
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v3.1.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v3.1.0-release
          path: AbhiSuno-v3.1.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0-${{ github.run_number }}
          name: "Abhi Suno v3.1.0 High Performance (Build ${{ github.run_number }})"
          body: |
            ### 🎵 Abhi Suno v3.1.0 High Performance Edition
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - 🚀 Low-latency playback with intelligent pre-buffering (~120s)
            - ⚡ Background next-song prefetch (~13s) for zero-latency skips
            - 🛡️ 4-Tier cache engine with permanent offline download protection
            - 📦 Unified Audio Provider Adapter architecture with request deduplication
            - 🎨 YouTube Music Explore tab, Themes (Dark, Light, Glass) & 100% Pure Localization
            - 🔄 In-App GitHub Updates checker

            **Direct Download:** Download `AbhiSuno-v3.1.0-release.apk` below!
          files: AbhiSuno-v3.1.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
