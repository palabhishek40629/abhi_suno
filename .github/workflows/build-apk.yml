name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.jks \
            -alias abhisuno -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass abhisuno123 -keypass abhisuno123 \
            -dname "CN=Abhishek Pal, OU=AbhiSuno, O=AbhiSuno Inc, L=Varanasi, S=UP, C=IN"

      - name: Build Android APK (Fat Release APK)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build.log

      - name: Capture Build Failure Log
        if: failure()
        run: |
          tail -n 120 build.log > build_error.txt
          cat build_error.txt

      - name: Publish Failure Details to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error-${{ github.run_number }}
          name: "Build Failure Log ${{ github.run_number }}"
          body_path: build_error.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v4.4.1-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v4.4.1-release
          path: AbhiSuno-v4.4.1-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4.1-${{ github.run_number }}
          name: "Abhi Suno v4.4.1 Master Edition (Build ${{ github.run_number }})"
          body: |
            ### 🎧 Abhi Suno v4.4.1 Master Edition
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - ⚡ **100% JioSaavn Playback & Fast Offline Recovery:**
              - Purged all legacy YouTube & Piped proxy adapters (`piped_invidious_adapter.dart` deleted).
              - 100% JioSaavn Akamai CDN streaming with DES decryption and multi-bitrate fallback (320kbps -> 160kbps -> 96kbps).
              - Fixed infinite loading spinner on stream failure / offline mode (immediately resets to idle).
              - Lowered cache size threshold from 500KB to 10KB so offline cached tracks always play instantly.
            - 🌟 **Subtle 3D Curved Paragraph Karaoke with 100% Hindi Grammar:**
              - Active singer lyrics line styled as a subtle 3D curved plate (`scale: 1.04`, no oversized zoom).
              - 1,200+ song vocabulary words with 100% authentic Hindi grammar, correct matras, anusvara, and chandrabindu.
              - LRCLIB millisecond synced timestamps prioritized so singer voice line detection works on all songs.
              - Dynamic track change: lyrics sheet dynamically reloads when song changes without freezing.
              - Seeking back to intro instrumental resets highlight and scrolls to top smoothly.
            - 📱 **Performance & UX Refinements:**
              - Screens list cached in `initState` to eliminate widget recreation and memory churn.
              - Error-resilient directory scanning for device local audio.

            **Direct APK Download:** `AbhiSuno-v4.4.1-release.apk`
          files: AbhiSuno-v4.4.1-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

