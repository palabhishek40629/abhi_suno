name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Fat Release APK)
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v3.2.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v3.2.0-release
          path: AbhiSuno-v3.2.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.0-${{ github.run_number }}
          name: "Abhi Suno v3.2.0 (Build ${{ github.run_number }})"
          body: |
            ### 🎵 Abhi Suno v3.2.0 - JioSaavn Akamai CDN Engine
            **Created by Abhishek Pal (Computer Science & Engineering Student)**

            - 🚀 **Zero-Buffering JioSaavn Akamai CDN Playback:** 320 kbps & 160 kbps direct unencrypted audio streaming (<0.1s instant start).
            - 🛡️ **YouTube Explode Dual Engine:** Seamless fallback without 403 Forbidden or SABR throttling.
            - ✨ **Animated Startup Splash Screen:** Centered 3D Golden Crown Logo & Abhishek Pal CSE Student creator credit with smooth, swift transitions.
            - ❤️ **Favorites & Liked Songs Section:** Instant like/unlike with persistence and 1-tap playback in Library.
            - 📤 **Native Music Share:** Share any song seamlessly across apps via native Android sharesheet.
            - 💾 **4-Tier Cache & Permanent Downloads Vault:** In-app downloads protected from temporary cleanup.
            - 🎧 **Device Audio Import:** Scan and play local songs stored on the phone.
            - 🌐 **100% Pure Localization:** Dedicated settings language switcher (Hindi & English).

            **Direct APK Download:** `AbhiSuno-v3.2.0-release.apk`
          files: AbhiSuno-v3.2.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
