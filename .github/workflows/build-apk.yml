name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Fat Release APK)
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v3.4.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v3.4.0-release
          path: AbhiSuno-v3.4.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.4.0-${{ github.run_number }}
          name: "Abhi Suno v3.4.0 (Build ${{ github.run_number }})"
          body: |
            ### 🎵 Abhi Suno v3.4.0 - Master Technical Release & Anti-Hang Performance Guard
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - 🛡️ **Anti-Hang Performance Guard & Memory Watchdog:**
              - Strict 40 MB max memory cache and 100 image capacity throttling to eliminate memory leaks and scroll stutter.
              - App lifecycle observer that flushes volatile bitmap memory when paused or backgrounded.
              - `PerformanceGuard.safeAsync` wrapping all remote socket calls with 7-second timeouts to eliminate UI freezes.
            - 🎧 **Preserved External Visual Assets:**
              - In-App Neon Headphone Logo: `https://chatgpt.com/sm_6aae1576163c8191aa57a1716d8dd07b`
              - Startup Promo Poster: `https://chatgpt.com/s/m_6aae18b1a7c881919bccb713a494d32b`
            - 👤 **Customizable Profile Screen:**
              - Native image picker for custom avatar with fallback to creator photo.
              - Audio streaming quality selection (320 kbps & 160 kbps).
              - Real-time device storage info via Android `StatFs` and cache clearing.
              - Developer portfolio, LinkedIn, and GitHub links.
            - 🌐 **21 Indian Constitutional & Regional Languages:**
              - Hindi, English, Bhojpuri, Punjabi, Bengali, Marathi, Gujarati, Tamil, Telugu, Kannada, Malayalam, Odia, Assamese, Rajasthani, Haryanvi, Maithili, Urdu, Sanskrit, Sindhi, Nepali, Konkani with auto-locale detection.
            - 🗂️ **Comprehensive 62 Categories & Bhojpuri Subcategories:**
              - 12 Bhojpuri subcategories: Birha, Lokgeet, Chhath Geet, Devi Geet, DJ Remix, Vivah Geet, Bol Bam, Sohar, Nirgun, Ropani Geet, and more.
              - 3D frosted glass cards with glowing gradients and Old/New filter pills.
            - 🔍 **Smart Search with Circular History:**
              - One-click instant search from history chips and long-press deletion modal.
              - Live debounced search suggestions while typing.
            - 📁 **Offline Downloads First Library:**
              - Moved Downloads to first tab (zero clicks).
              - Sorting bar: A-Z, Z-A, Newest, Oldest.
              - One-click continuous mix playback.
            - 🌌 **Midnight Blue Glass Lyrics Modal:**
              - ~15% frosted glass blur with high-contrast typography.
            - 🔗 **Android Native Share Receiver:**
              - Seamlessly accepts shared links from external apps to discover and play songs.
            - 🚀 **Zero-Buffering JioSaavn Akamai CDN Playback:**
              - High-fidelity 320 kbps & 160 kbps direct unencrypted audio streaming.

            **Direct APK Download:** `AbhiSuno-v3.4.0-release.apk`
          files: AbhiSuno-v3.4.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
