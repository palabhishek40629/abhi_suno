name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Fat Release APK)
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v4.0.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v4.0.0-release
          path: AbhiSuno-v4.0.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0-${{ github.run_number }}
          name: "Abhi Suno v4.0.0 Master Edition (Build ${{ github.run_number }})"
          body: |
            ### 🎧 Abhi Suno v4.0.0 Master Edition - Settings Consolidation, Free Google Auth & Offline Artwork
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - ⚙️ **Unified "Settings (सेटिंग्स)" Section in Profile:**
              - Consolidated App Theme, Language & Region, Download Quality (Song + Thumbnail), Storage Management, App Updates, Share App, and About into a single dedicated "सेटिंग्स (Settings)" section in ProfileScreen.
              - Audio Engine and Party Room remain prominently on top.
            - 👤 **Clean Profile Header & Compact Top-Left Edit Profile:**
              - Removed cluttering pencil icons from user avatar, name, and bio for a clean cyberpunk look.
              - Added compact 3D "एडिट प्रोफ़ाइल" button at top-left.
            - 🔐 **Free Google Sign-In & Login System:**
              - 100% free Google Sign-In with 3D button ("Google से साइन इन करें"), syncing Gmail, name, and avatar directly into UserService.
            - 🖼️ **Offline Thumbnail Downloading & Quality Preferences:**
              - Automatically downloads lightweight artwork (~8-12 KB) alongside song files for offline playback in Library.
              - Added Song Bitrate (320k/160k/96k) and Thumbnail (Low/Medium/High) quality settings.
            - ▶️ **Home Feed Bottom Song Play Button Icon Fix:**
              - Rebuilt bottom track play button with dual reactive stream (playbackState + mediaItem).
              - Play icon (`Icons.play_arrow_rounded`) accurately represents state with vibrant active playback glow.
            - 🔗 **Universal Playable Song Share Links:**
              - Share song with instant web playback (`music.youtube.com`), official JioSaavn link, and deep link (`abhisuno://play`).

            **Direct APK Download:** `AbhiSuno-v4.0.0-release.apk`
          files: AbhiSuno-v4.0.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

