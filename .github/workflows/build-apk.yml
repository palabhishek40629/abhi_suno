name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos

      - name: Build Android APK (Fat Release APK)
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v4.1.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v4.1.0-release
          path: AbhiSuno-v4.1.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.0-${{ github.run_number }}
          name: "Abhi Suno v4.1.0 Master Edition (Build ${{ github.run_number }})"
          body: |
            ### 🎧 Abhi Suno v4.1.0 Master Edition - Full Spotify Architecture & Zero Crashes
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - 🚀 **Universal 3D Tactile Physics with Scroll Guard:**
              - 10-pixel drag threshold prevents unintended button presses during list scrolling.
            - 👤 **Compact Top-Right "एडिट प्रोफ़ाइल" Button:**
              - Bold `FontWeight.w900` button in AppBar actions for ergonomic access.
            - 📱 **Dedicated Full-Page Settings Screens:**
              - Clean dedicated sub-pages for Theme, Language, Downloads, Storage, and About.
            - 🔙 **Multi-Tap Smart Navigation:**
              - 1 Tap: Go back or return to Home.
              - 2 Taps: Instant return to Home from deep nested menus.
              - 3 Taps: Full exit terminating all background audio services.
            - ⚡ **Warm/Cold Resume Splash Overlay:**
              - Smooth 1.2-second startup animation ensures zero UI freeze or hang on return.
            - 🌐 **Ultra-Low-Latency WebSocket Party Room:**
              - WebSocket connection (`wss://ntfy.sh/$topic/ws`) with auto-reconnect and SSE fallback.
            - 📶 **Auto Offline Detection & Instant Downloads Navigation:**
              - Floating offline banner with 1-tap jump to downloaded library.
            - 📜 **JioSaavn Official Dual-Engine Lyrics & Offline Sync:**
              - Synchronized `.lrc` downloaded for 100% offline karaoke lyrics.
            - 🖼️ **Offline Artwork Local File Fallback:**
              - Downloaded songs always display offline album art in player, mini player, and lock screen notification.
            - ▶️ **Reactive Play/Pause State:**
              - Real-time icon toggling between play and pause across all screens and playlists.
            - 🎵 **Spotify Reorderable Queue & 25° Angled Genre Cards:**
              - Live drag-and-drop queue reordering and filtered search in Downloads and Liked Songs.

            **Direct APK Download:** `AbhiSuno-v4.1.0-release.apk`
          files: AbhiSuno-v4.1.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

