name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.jks \
            -alias abhisuno -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass abhisuno123 -keypass abhisuno123 \
            -dname "CN=Abhishek Pal, OU=AbhiSuno, O=AbhiSuno Inc, L=Varanasi, S=UP, C=IN"

      - name: Build Android APK (Fat Release APK)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build.log

      - name: Capture Build Failure Log
        if: failure()
        run: |
          tail -n 120 build.log > build_error.txt
          cat build_error.txt

      - name: Publish Failure Details to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error-${{ github.run_number }}
          name: "Build Failure Log ${{ github.run_number }}"
          body_path: build_error.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v4.4.3-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v4.4.3-release
          path: AbhiSuno-v4.4.3-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4.3-${{ github.run_number }}
          name: "Abhi Suno v4.4.3 Ultimate Edition (Build ${{ github.run_number }})"
          body: |
            ### 🎧 Abhi Suno v4.4.3 Ultimate Edition
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - 📥 **Comprehensive Download Buttons & Batch "Download All":**
              - Added quick download buttons on all song tiles in Home Screen (horizontal cards and infinite feed).
              - Added "सभी डाउनलोड" (Download All) button in Explore category/playlist detail screens.
            - 🛡️ **Sequential & Resilient Resumable Downloads:**
              - Strict one-by-one sequential download worker (never hammers parallel connections).
              - HTTP Range support (`Range: bytes=$offset-`): partially downloaded files are **never deleted**, even on network failure or abrupt disconnection.
              - Auto-resumes from the exact downloaded byte offset when internet reconnects.
            - 📊 **Immediate Downloads Tab & Live Notification Bar Progress:**
              - Songs immediately appear in Downloads tab with live percentage, animated progress bar, and queued position pills.
              - Live notification in top Android notification bar showing track title and progress %.
            - 🔤 **Punjabi Gurmukhi to Hindi Devanagari Transliteration:**
              - Automatic transliteration of Gurmukhi script into authentic Devanagari Hindi so songs render flawlessly in `AmsSudha` font without missing glyphs.
              - 100+ expanded Punjabi & Bollywood vocabulary terms for 100% grammatically correct lyrics.
            - 🎤 **Refined Centered 3D Karaoke:**
              - Active karaoke line anchored at screen center throughout playback with end-of-song balance.
              - Sleek 1.02 scale and thin 1.0 neon border without jarring zoom.

            **Direct APK Download:** `AbhiSuno-v4.4.3-release.apk`
          files: AbhiSuno-v4.4.3-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

