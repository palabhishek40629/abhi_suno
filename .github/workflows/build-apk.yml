name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Fat Release APK)
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v3.3.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v3.3.0-release
          path: AbhiSuno-v3.3.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.0-${{ github.run_number }}
          name: "Abhi Suno v3.3.0 (Build ${{ github.run_number }})"
          body: |
            ### 🎵 Abhi Suno v3.3.0 - Ultimate Music & In-App Update Engine
            **Created by Abhishek Pal (Computer Science & Engineering Student)**

            - 🎨 **Featured Startup Brand Logo:** Abhishek Pal opening emblem & creator poster with golden aura and smooth transition.
            - 🔄 **Native In-App Auto-Updater:** Dynamic package versioning, byte-level download progress reporting, and native FileProvider package installation.
            - ⚡ **Instant Reactive Downloads:** Completed downloads appear in library immediately without manual refresh.
            - 🔘 **3-Dot Overflow Menu:** Play, Add to Playlist, Create Playlist, Delete with confirmation, Share file stream, Export to public device Music storage, and Song Information.
            - 🔀 **Stateful Queue Shuffle & Repeat:** Real Fisher-Yates shuffle queue preservation and track loop modes.
            - 🏠 **Smart Home Dashboard:** "Continue Listening" hero resume card with playback position tracking, Recently Played, and More by Artist recommendations.
            - 🗂️ **Modern 2-Column Category Grid:** 10 curated mood categories opening dedicated category detail screens with batch playback and shuffle.
            - 📂 **Playlist Power-ups:** Playlist renaming and batch download with progress dialog.
            - 🚀 **Zero-Buffering JioSaavn Akamai CDN Playback:** 320 kbps & 160 kbps direct unencrypted audio streaming (<0.1s instant start).

            **Direct APK Download:** `AbhiSuno-v3.3.0-release.apk`
          files: AbhiSuno-v3.3.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
