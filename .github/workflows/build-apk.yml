name: Build Abhi Suno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Fat Release APK)
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AbhiSuno-v3.9.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiSuno-v3.9.0-release
          path: AbhiSuno-v3.9.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.9.0-${{ github.run_number }}
          name: "Abhi Suno v3.9.0 Master Edition (Build ${{ github.run_number }})"
          body: |
            ### 🎧 Abhi Suno v3.9.0 Master Edition - Real-Time Party Sync & Interactive Profile
            **Developed by Abhishek Pal (Computer Science & Engineering Student)**

            - 👥 **पार्टी रूम ("सुनो साथ में" / Listen Together) Real-Time Sync:**
              - Real-time global network synchronization across unlimited devices via ultra-fast pub/sub channel.
              - Live play/pause/resume sync, song queue tracking, and real-time active listener counts.
              - Share party room code directly to WhatsApp with 1-tap invitation link.
            - 👤 **Customizable Profile & Login System:**
              - Edit user name, avatar (custom photo or 6 musical avatars), and status/bio (editable "Computer Science & Engineering Student").
              - Beautiful 3D Dynamic **"प्रोफ़ाइल अपडेट करें (Update Profile)"** elevation button with instant local persistence.
            - 🔗 **Direct Playable Song Link in Sharing:**
              - Song share now sends direct playable JioSaavn web links (`perma_url`) and app download link.
            - 🎯 **Split Tap UX & Active Song Highlighting:**
              - Tapping the Play button on any song tile directly plays/pauses without opening the full player.
              - Tapping anywhere else on the row opens the full Now Playing screen.
              - Active song indicator (live equalizer animation + cyan glow + dynamic play/pause state) in playlists and search.
            - 📄 **Dedicated Next-Page Navigation:**
              - "About Application" opens as a dedicated full screen with rich dev info, version details, and social links.
              - "Language & Region" opens as an expansive full-screen selector with search filter and native language scripts.
            - 🧹 **Clean Home Feed:**
              - Removed "Continue Listening" section for a cleaner, faster home browsing experience.

            **Direct APK Download:** `AbhiSuno-v3.9.0-release.apk`
          files: AbhiSuno-v3.9.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

